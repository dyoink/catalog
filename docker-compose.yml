version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aquacms-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=aquacms-db;Port=5432;Database=aquacms;Username=aquacms;Password=${DB_PASSWORD:-AquaCMS@2025}
      - ASPNETCORE_ENVIRONMENT=Production
      - Site__Url=${SITE_URL:-http://localhost:8080}
      - TZ=Asia/Ho_Chi_Minh
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: aquacms-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: aquacms
      POSTGRES_USER: aquacms
      POSTGRES_PASSWORD: ${DB_PASSWORD:-AquaCMS@2025}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquacms"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
